name: Marketplace identity

# Run once by hand (Actions → Marketplace identity → Run workflow) after the
# Azure managed identity is set up. Prints the ID to add as a member of the
# Marketplace publisher, and checks that the sign-in works.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  show-id:
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Marketplace member ID
        run: |
          # 499b84ac-... is the Azure DevOps / Marketplace resource.
          res=499b84ac-1321-427f-aa17-267ca6975798
          # The command from the VS Code publishing docs; connectionData as a
          # fallback, since an identity may not have a profile yet.
          id=$(az rest -u https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource $res --query id -o tsv 2>/dev/null) || \
          id=$(az rest -u https://app.vssps.visualstudio.com/_apis/connectionData --resource $res --query authenticatedUser.id -o tsv)
          echo "Add this ID as a Contributor member of the kaedinger publisher:"
          echo "$id"
          echo "### Marketplace member ID: \`$id\`" >> "$GITHUB_STEP_SUMMARY"
